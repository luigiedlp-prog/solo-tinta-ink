<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Gestión · Solo Tinta Ink</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#000000;
  --glass:rgba(20,18,17,.5);
  --sep:rgba(255,255,255,.1);
  --sep-bright:rgba(255,255,255,.16);
  --label:#ffffff;
  --label2:rgba(235,235,245,.64);
  --label3:rgba(235,235,245,.34);
  --tint:#c23349;
  --tint-bright:#ea3f58;
  --tint-glow:#ff2d4d;
  --tint-press:#9c2939;
  --green:#32d366;
  --serif:'Fraunces',serif;
  --sans:'Inter',-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{scroll-behavior:smooth;}
body{margin:0;color:var(--label);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;background:#020202;overflow-x:hidden;}
.bgLayer{position:fixed;inset:0;overflow:hidden;z-index:-1;pointer-events:none;isolation:isolate;}
.blob{position:absolute;border-radius:50%;filter:blur(95px);}
.blob1{width:260px;height:260px;top:-60px;left:-60px;background:var(--tint-glow);opacity:.4;}
.blob2{width:220px;height:220px;top:420px;right:-70px;background:#f2efe9;opacity:.13;}
.blob3{width:300px;height:220px;bottom:-40px;left:20%;background:var(--tint-glow);opacity:.26;}
.wrap{width:min(600px,100%);margin:auto;position:relative;z-index:1;}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;position:relative;z-index:1;}
.loginBrand{font-family:var(--serif);font-style:italic;font-weight:700;font-size:30px;margin-bottom:6px;}
.loginSub{color:var(--label2);font-size:13.5px;margin-bottom:44px;}
.dots{display:flex;gap:16px;margin-bottom:40px;}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--sep-bright);background:transparent;transition:background .15s,box-shadow .15s;}
.dot.filled{background:var(--tint-bright);box-shadow:0 0 14px rgba(255,45,77,.6);border-color:var(--tint-bright);}
.dots.shake{animation:shake .35s;}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinpad{display:grid;grid-template-columns:repeat(3,72px);gap:18px;}
.key{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.06);border:1px solid var(--sep);color:var(--label);font-size:26px;font-weight:500;font-family:var(--sans);backdrop-filter:blur(10px);}
.key:active{background:rgba(255,255,255,.14);}
.key.ghost{background:none;border:none;}

/* ---------- APP SHELL ---------- */
#app{display:none;}
.navbar{
  position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(0,0,0,.42);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  border-bottom:1px solid var(--sep);
}
.navTitle{font-family:var(--serif);font-weight:700;font-size:22px;}
.navSub{color:var(--tint-bright);font-size:13px;font-weight:600;}
.screen{display:none;padding-bottom:110px;}
.screen.active{display:block;}
.sectionCaption{margin:22px 16px 9px;font-size:12.5px;font-weight:700;letter-spacing:.4px;color:var(--label3);text-transform:uppercase;}
.group{
  position:relative;background:var(--glass);border-radius:18px;margin:0 16px 14px;overflow:hidden;
  border:1px solid var(--sep-bright);box-shadow:0 24px 60px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1);
  backdrop-filter:blur(38px) saturate(1.7);-webkit-backdrop-filter:blur(38px) saturate(1.7);
}

/* ---------- PRESUPUESTOS ---------- */
.reqCard{padding:15px 16px;border-bottom:1px solid var(--sep);}
.reqCard:last-child{border-bottom:none;}
.reqTop{display:flex;justify-content:space-between;align-items:start;gap:10px;}
.reqName{font-size:16px;font-weight:700;}
.reqMeta{font-size:12.5px;color:var(--label2);margin-top:2px;}
.reqTime{font-size:11.5px;color:var(--label3);white-space:nowrap;}
.reqDesc{font-size:13.5px;color:var(--label2);margin-top:9px;line-height:1.5;}

.todaySummary{padding:15px 16px;overflow:hidden;}
.todaySummaryMain{display:flex;justify-content:space-between;align-items:center;gap:12px;}
.todayEyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--tint-bright);font-weight:800;}
.todayNext{font-size:18px;font-weight:750;margin-top:3px;}
.todayMeta{font-size:12.5px;color:var(--label3);margin-top:3px;}
.todayGo{flex:0 0 auto;border:1px solid var(--sep-bright);background:rgba(255,255,255,.07);color:var(--label);border-radius:11px;padding:9px 11px;font:600 12px var(--sans);}
.todayGo:active{background:rgba(255,255,255,.14);}
.todayAlerts{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;padding-top:12px;border-top:1px solid var(--sep);}
.todayAlerts span{font-size:11px;color:var(--label2);background:rgba(255,255,255,.06);border:1px solid var(--sep);border-radius:99px;padding:5px 9px;}

.reqTags{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
.tag{background:rgba(255,255,255,.07);border:1px solid var(--sep);border-radius:99px;padding:4px 10px;font-size:11px;color:var(--label2);display:flex;align-items:center;gap:4px;}
.reqActions{display:flex;gap:8px;margin-top:12px;}
.miniBtn{flex:1;padding:10px;border-radius:11px;font-size:13.5px;font-weight:600;font-family:var(--sans);border:none;}
.miniBtn.primary{background:linear-gradient(180deg,var(--tint-bright),var(--tint));color:#fff;box-shadow:0 10px 24px rgba(255,45,77,.4);}
.miniBtn.ghost{background:rgba(255,255,255,.06);color:var(--label2);border:1px solid var(--sep);}
.badge{background:var(--tint-bright);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:2px 7px;box-shadow:0 0 10px rgba(255,45,77,.6);}
.confirmBanner{display:none;position:fixed;left:16px;right:16px;top:calc(64px + env(safe-area-inset-top));z-index:8;padding:12px 14px;border-radius:12px;background:rgba(50,211,102,.16);border:1px solid rgba(50,211,102,.45);color:#8fe6ac;font-size:13.5px;font-weight:600;box-shadow:0 14px 34px rgba(0,0,0,.4);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);}
.confirmBanner.show{display:block;}
.rowStack.invalid{background:rgba(255,80,80,.1);}

/* ---------- CALENDARIO ---------- */
.calHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;gap:10px;}
.calHeadCenter{min-width:0;flex:1;text-align:center;}
.calMonth{font-family:var(--serif);font-weight:700;font-size:19px;}
.calSelectedMeta{font-size:11.5px;color:var(--label3);margin-top:2px;}
.calToday{background:rgba(255,255,255,.06);border:1px solid var(--sep);color:var(--label2);border-radius:10px;padding:8px 10px;font:600 11.5px var(--sans);white-space:nowrap;}
.calToday:active{background:rgba(255,255,255,.14);}
.calArrow{background:rgba(255,255,255,.06);border:1px solid var(--sep);color:var(--label2);width:32px;height:32px;border-radius:50%;font-size:16px;font-family:var(--sans);}
.calArrow:active{background:rgba(255,255,255,.16);}
.weekRow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 16px;margin-bottom:6px;}
.weekRow span{text-align:center;font-size:10.5px;color:var(--label3);font-weight:600;}
.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 16px 8px;}
.day{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;background:rgba(255,255,255,.04);border:1px solid transparent;position:relative;}
.day.other{visibility:hidden;}
.day.closed{color:var(--label3);background:rgba(255,255,255,.015);}
.day.today{border-color:var(--tint-bright);box-shadow:0 0 12px rgba(255,45,77,.35);font-weight:700;}
.day.full{background:rgba(255,255,255,.02);color:var(--label3);}
.day .fullLbl{font-size:7px;letter-spacing:.2px;color:var(--tint-bright);text-transform:uppercase;}
.dayDot{width:5px;height:5px;border-radius:50%;background:var(--tint-bright);box-shadow:0 0 6px rgba(255,45,77,.7);}
.dayCount{min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--tint-bright);color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 0 6px rgba(255,45,77,.7);}
.day.selected{background:linear-gradient(180deg,var(--tint-bright),var(--tint));color:#fff;box-shadow:0 8px 22px rgba(255,45,77,.5);}
.day.selected .dayDot{background:#fff;}
.dayAgenda{padding:4px 16px 14px;}
.dayAgendaHead{display:flex;align-items:end;justify-content:space-between;gap:10px;padding:4px 0 11px;}
.dayAgendaTitle{font-family:var(--serif);font-weight:700;font-size:20px;}
.dayAgendaMeta{font-size:12px;color:var(--label3);margin-top:2px;}
.dayAgendaCount{font-size:11px;color:var(--label2);background:rgba(255,255,255,.06);border:1px solid var(--sep);border-radius:99px;padding:5px 9px;white-space:nowrap;}
.apptCard{background:rgba(255,255,255,.045);border:1px solid var(--sep);border-radius:14px;padding:13px;margin-bottom:9px;}
.apptMain{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
.apptTime{font-size:19px;font-weight:750;letter-spacing:-.3px;}
.apptName{font-size:14px;font-weight:650;margin-top:2px;}
.apptMeta{font-size:12px;color:var(--label3);margin-top:4px;}
.apptStatus{font-size:10.5px;font-weight:700;color:var(--label2);border:1px solid var(--sep);border-radius:99px;padding:5px 8px;white-space:nowrap;}
.apptActions{display:flex;gap:7px;margin-top:11px;}
.apptActions .miniBtn{padding:9px 8px;font-size:12.5px;}
.agendaRow{display:flex;justify-content:space-between;align-items:center;padding:11px 14px;border-bottom:1px solid var(--sep);font-size:14px;}
.agendaRow:last-child{border-bottom:none;}
.agendaRow span{color:var(--label2);font-size:12.5px;}
.fullToggleRow{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;}
.fullToggleRow .t{font-size:15px;}
.fullToggleRow .s{font-size:12px;color:var(--label3);margin-top:2px;}
.switch{width:46px;height:28px;border-radius:99px;background:rgba(255,255,255,.12);position:relative;border:1px solid var(--sep);flex:0 0 auto;}
.switch::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#fff;top:2px;left:2px;transition:.2s;}
.switch.on{background:linear-gradient(180deg,var(--tint-bright),var(--tint));}
.switch.on::after{left:21px;}

/* ---------- FINANZAS ---------- */
.finTotal{padding:18px 16px 6px;}
.finMonthNav{display:flex;align-items:center;justify-content:space-between;gap:10px;}.finMonthHint{font-size:11px;color:var(--label3);margin-top:3px;text-transform:none;letter-spacing:0;}.finHero{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;}.finHeroLabel{font-size:12px;color:var(--label3);margin-top:7px;}.finHeroSide{display:flex;flex-direction:column;align-items:flex-end;gap:5px;padding-bottom:3px;font-size:11px;color:var(--label2);}.financeBreakdown{margin:12px 16px 0;background:var(--glass);border:1px solid var(--sep-bright);border-radius:14px;padding:13px 14px;}.financeBreakTitle{font-size:12px;color:var(--label3);text-transform:uppercase;letter-spacing:.3px;font-weight:700;margin-bottom:8px;}.financeBreakRows{display:grid;grid-template-columns:1fr 1fr;gap:8px;}.financeBreakRows>div{display:flex;flex-direction:column;gap:3px;}.financeBreakRows span{font-size:12px;color:var(--label3);}.financeBreakRows strong{font-size:15px;}
.finLabel{font-size:12.5px;color:var(--label3);text-transform:uppercase;letter-spacing:.3px;font-weight:700;}
.finAmount{font-family:var(--serif);font-weight:700;font-size:34px;margin-top:4px;}
.ledgerRow{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;border-bottom:1px solid var(--sep);}
.ledgerRow:last-child{border-bottom:none;}
.ledgerDate{font-size:15px;font-weight:600;}
.ledgerSub{font-size:12px;color:var(--label3);margin-top:2px;}
.ledgerAmount{font-size:15px;font-weight:700;}
.statsGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px;margin:4px 0 0;}
.statCard{background:var(--glass);border:1px solid var(--sep-bright);border-radius:14px;padding:12px 6px;text-align:center;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);}
.statNum{font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.2;}
.statLbl{font-size:9.5px;color:var(--label3);margin-top:4px;text-transform:uppercase;letter-spacing:.2px;}

.segmented{display:flex;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);border-radius:10px;padding:3px;gap:2px;border:1px solid var(--sep-bright);}
.seg{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:13px;color:var(--label2);font-weight:500;}
.seg.active{background:linear-gradient(180deg,var(--tint-bright),var(--tint));color:#fff;font-weight:700;box-shadow:0 8px 22px rgba(255,45,77,.5);}

.stockRow{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--sep);}
.stockRow:last-child{border-bottom:none;}
.stockInfo{flex:1;min-width:0;}
.stockName{font-size:15px;font-weight:600;}
.stockQty{font-size:12.5px;color:var(--label3);margin-top:2px;}
.stockBadge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap;}
.stockBadge.ok{background:rgba(50,211,102,.15);color:var(--green);}
.stockBadge.low{background:rgba(255,45,77,.18);color:var(--tint-bright);}
.stockCtrls{display:flex;gap:6px;}
.stockCtrls button{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid var(--sep);color:var(--label);font-size:16px;font-family:var(--sans);}
.stockCtrls button:active{background:rgba(255,255,255,.16);}

/* ---------- AJUSTES ---------- */
.settingRow{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--sep);}
.settingRow:last-child{border-bottom:none;}
.settingIcon{width:22px;height:22px;color:var(--tint-bright);flex:0 0 auto;}
.settingText{flex:1;font-size:15.5px;}
.settingChev{width:8px;height:13px;color:var(--label3);}
.settingRow.danger .settingText{color:#ff6b6b;}
.settingRow.danger .settingIcon{color:#ff6b6b;}

/* ---------- TAB BAR ---------- */
.tabbar{
  overflow-x:auto;scrollbar-width:none;
  position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;
  padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.55);backdrop-filter:blur(28px) saturate(1.7);-webkit-backdrop-filter:blur(28px) saturate(1.7);
  border-top:1px solid var(--sep-bright);
}
.tabbar::-webkit-scrollbar{display:none}
.tab{flex:0 0 76px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--label3);background:none;border:none;font-family:var(--sans);position:relative;}
.tab svg{width:23px;height:23px;}
.tab span{font-size:10px;font-weight:600;}
.tab.active{color:var(--tint-bright);}
.tabBadge{position:absolute;top:-3px;right:22%;background:var(--tint-bright);color:#fff;font-size:9px;font-weight:700;border-radius:99px;min-width:15px;height:15px;display:flex;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 0 8px rgba(255,45,77,.6);}

/* ---------- SHEET ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(6px);display:none;align-items:flex-end;justify-content:center;z-index:10;}
.overlay.show{display:flex;}
.grabber{width:36px;height:5px;border-radius:3px;background:var(--label3);margin:9px auto 6px;}
.sheetClose{position:absolute;top:14px;right:16px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--sep-bright);color:var(--label2);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;z-index:2;}
.sheetClose:active{background:rgba(255,255,255,.18);}
.sheet{
  position:relative;width:min(600px,100%);background:rgba(15,14,15,.82);backdrop-filter:blur(40px) saturate(1.7);-webkit-backdrop-filter:blur(40px) saturate(1.7);
  border-radius:22px 22px 0 0;border:1px solid var(--sep-bright);border-bottom:none;
  padding:0 0 calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.32,.72,0,1);
  box-shadow:0 -30px 80px rgba(0,0,0,.7);max-height:85vh;overflow-y:auto;
}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheetTitle{font-family:var(--serif);font-weight:700;font-size:21px;padding:4px 20px 14px;}
.rowStack{display:flex;flex-direction:column;padding:12px 20px;border-bottom:1px solid var(--sep);}
.rowStack:last-child{border-bottom:none;}
.rowLabel{font-size:13px;color:var(--label2);margin-bottom:5px;font-weight:500;}
.rowStack input{border:none;background:transparent;color:var(--label);font-family:var(--sans);font-size:16px;padding:0;outline:0;width:100%;font-weight:500;}
.sheetActions{padding:16px 20px 0;}
.btn{width:100%;padding:15px;border-radius:15px;font-size:17px;font-weight:700;border:none;font-family:var(--sans);}
.btnFilled{background:linear-gradient(180deg,var(--tint-bright),var(--tint));color:#fff;box-shadow:0 18px 44px rgba(255,45,77,.55);}
.btnFilled:active{background:var(--tint-press);}
.btnDanger{background:rgba(255,80,80,.12);color:#ff6b6b;border:1px solid rgba(255,80,80,.35);}
.btnDanger:active{background:rgba(255,80,80,.2);}
.rowStack input:disabled{color:var(--label3);}
.clientRow{display:flex;justify-content:space-between;align-items:center;padding:13px 20px;border-bottom:1px solid var(--sep);}
.clientSearch{padding:12px 16px 4px;}
.clientSearch input{width:100%;box-sizing:border-box;background:rgba(255,255,255,.07);border:1px solid var(--sep-bright);border-radius:13px;color:var(--label);padding:12px 14px;font:500 16px var(--sans);outline:0;}
.clientSearch input:focus{border-color:var(--tint-bright);}
.clientRow{cursor:pointer;}
.clientRow:active{background:rgba(255,255,255,.06);}
.clientArrow{color:var(--label3);font-size:18px;}
.clientDetailHead{padding:18px 20px 14px;}
.clientDetailName{font-family:var(--serif);font-size:28px;font-weight:700;line-height:1.05;}
.clientDetailWa{font-size:14px;color:var(--label3);margin-top:5px;}
.clientMetrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 16px 12px;}
.clientMetric{background:var(--glass);border:1px solid var(--sep-bright);border-radius:14px;padding:12px 8px;text-align:center;}
.clientMetric b{display:block;font-family:var(--serif);font-size:18px;}
.clientMetric span{font-size:9.5px;color:var(--label3);text-transform:uppercase;letter-spacing:.2px;}
.clientTimeline{padding:0 16px 18px;}
.clientEvent{padding:12px 0;border-bottom:1px solid var(--sep);}
.clientEvent:last-child{border-bottom:none;}
.clientNoteBox{padding:14px 16px;}
.clientNoteText{font-size:13.5px;color:var(--label2);line-height:1.5;white-space:pre-wrap;}
.clientNoteEmpty{font-size:13px;color:var(--label3);line-height:1.45;}
.clientQuickActions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px 4px;}
.clientQuickActions .miniBtn{min-height:42px;}
.clientEventTop{display:flex;justify-content:space-between;gap:12px;font-size:13px;font-weight:650;}
.clientEventMeta{font-size:12px;color:var(--label3);margin-top:3px;line-height:1.35;}

.clientRow:last-child{border-bottom:none;}
.clientName{font-size:15px;font-weight:600;}
.clientWa{font-size:12.5px;color:var(--label3);margin-top:2px;}


.portfolioAdminCard{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--sep);align-items:center;}
.portfolioAdminCard:last-child{border-bottom:none;}
.portfolioAdminThumb{width:76px;height:76px;border-radius:13px;object-fit:cover;flex:0 0 auto;border:1px solid var(--sep-bright);background:#090909;}
.portfolioAdminBody{min-width:0;flex:1;}
.portfolioAdminName{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.portfolioAdminDesc{font-size:12.5px;color:var(--label3);line-height:1.35;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.portfolioAdminEdit{margin-top:7px;background:none;border:0;color:var(--tint-bright);font:600 12px var(--sans);padding:0;}
.sheet .rowStack{gap:0}
.sheet .rowStack input,.sheet .rowStack textarea,.sheet .rowStack select{background:rgba(255,255,255,.07)!important;border:1px solid var(--sep-bright)!important;border-radius:12px;padding:12px 14px!important;font-size:16px!important;color:var(--label);box-sizing:border-box;width:100%;font-family:var(--sans);outline:0;color-scheme:dark}
.sheet .rowStack textarea{line-height:1.4;min-height:96px;resize:none;overflow:hidden;display:block}

</style>
</head>
<body>
<div class="bgLayer"><div class="blob blob1"></div><div class="blob blob2"></div><div class="blob blob3"></div></div>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="loginBrand">Solo Tinta Ink</div>
  <div class="loginSub">Ingresá tu PIN</div>
  <div class="dots" id="dots">
    <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
  </div>
  <div id="loginErr" style="min-height:44px;max-width:280px;margin:-18px 0 18px;text-align:center;font-size:14px;line-height:1.35;color:#ff6b81;"></div>
  <div class="pinpad">
    <button class="key" onclick="press(1)">1</button><button class="key" onclick="press(2)">2</button><button class="key" onclick="press(3)">3</button>
    <button class="key" onclick="press(4)">4</button><button class="key" onclick="press(5)">5</button><button class="key" onclick="press(6)">6</button>
    <button class="key" onclick="press(7)">7</button><button class="key" onclick="press(8)">8</button><button class="key" onclick="press(9)">9</button>
    <button class="key ghost"></button><button class="key" onclick="press(0)">0</button><button class="key" onclick="del()">⌫</button>
  </div>
</div>

<!-- APP: el contenido real lo arma render() (más abajo) apenas hay sesión válida -->
<div id="app" style="display:none"></div>

<div class="overlay" id="genOverlay" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="genSheet"></div></div>

<script>
const API='/api';const BUILD='2026-09-23-FINAL';let pin='',D=null,tab='Presupuestos';const nowLocal=new Date();let month=`${nowLocal.getFullYear()}-${String(nowLocal.getMonth()+1).padStart(2,'0')}`,calDate=new Date();
const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>'$'+Number(v||0).toLocaleString('es-AR');
const dur=v=>{v=Number(v||0);return `${Math.floor(v/60)} h${v%60?' '+String(v%60).padStart(2,'0')+' min':''}`};
async function api(path,opts={}){let r;try{r=await fetch(API+path,{credentials:'same-origin',...opts})}catch(e){throw new Error('No se pudo conectar con el servidor. Abrí /api/health en tu dominio para ver si el Worker responde.')}let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Error de servidor');return d}
function renderDots(){[0,1,2,3].forEach(i=>document.querySelectorAll('.dot')[i]?.classList.toggle('filled',i<pin.length))}
function press(n){if(pin.length>=4)return;pin+=n;renderDots();if(pin.length===4)setTimeout(login,80)}function del(){pin=pin.slice(0,-1);renderDots()}
async function login(){const err=document.getElementById('loginErr');err.textContent='';try{await api('/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pin})});pin='';await load();document.getElementById('loginScreen').style.display='none'}catch(e){pin='';renderDots();err.textContent=e.message;const d=document.getElementById('dots');d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}}
async function load(){D=await api('/admin/data');render()}
function showTab(n){tab=n;render()}
const ICO={"Clientes": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2\"/><circle cx=\"9.5\" cy=\"7\" r=\"4\"/><path d=\"M19 8v6M16 11h6\"/></svg>", "Presupuestos": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M9 12h6M9 16h6M9 8h6\"/><rect x=\"4\" y=\"4\" width=\"16\" height=\"16\" rx=\"3\"/></svg>", "Portfolio": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"16\" rx=\"2\"/><circle cx=\"8\" cy=\"9\" r=\"1.4\"/><path d=\"M3 16l5-5 4 4 3-3 6 5\"/></svg>", "Calendario": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\"/><path d=\"M3 10h18M8 3v4M16 3v4\"/></svg>", "Finanzas": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><path d=\"M4 20V10M12 20V4M20 20v-7\"/></svg>", "Ajustes": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><circle cx=\"12\" cy=\"12\" r=\"3\"/><path d=\"M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z\"/></svg>"};const SICO=["<svg class=\"settingIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"14\" rx=\"2\"/><circle cx=\"8.5\" cy=\"10\" r=\"1.5\"/><path d=\"M21 15l-5-5-4 4-3-3-6 6\"/></svg>", "<svg class=\"settingIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2\"/><circle cx=\"10\" cy=\"7\" r=\"4\"/></svg>", "<svg class=\"settingIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M12 2C7 6 5 9 5 13a7 7 0 0 0 14 0c0-4-2-7-7-11z\"/></svg>", "<svg class=\"settingIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/><path d=\"M8 11V8a4 4 0 0 1 8 0v3\"/></svg>", "<svg class=\"settingIcon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"><path d=\"M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4\"/><path d=\"M16 17l5-5-5-5\"/><path d=\"M21 12H9\"/></svg>"];const CHEV="<svg class=\"settingChev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\"><path d=\"M9 5l7 7-7 7\"/></svg>";
const pad=n=>String(n).padStart(2,'0');let selDay=null,finTab='ingresos';
const ST={scheduled:'Agendado',completed:'Hecho',cancelled:'Cancelado',another_session:'Otra sesión'};
const fmtDay=k=>new Date(k+'T12:00:00').toLocaleDateString('es-AR',{weekday:'short',day:'numeric',month:'short'});
function render(){
 const app=document.getElementById('app');app.style.display='block';
 const np=D.quotes.filter(q=>q.status==='pending_quote').length;
 const tabs=['Presupuestos','Calendario','Clientes','Portfolio','Finanzas','Ajustes'];
 app.innerHTML=`<div class="navbar"><div class="navTitle">${tab}</div><div class="navSub">${tab==='Presupuestos'&&np?np+(np>1?' nuevos':' nuevo'):''}</div></div><div class="screen active" id="live"></div><div class="tabbar">${tabs.map(t=>`<button class="tab ${tab===t?'active':''}" onclick="showTab('${t}')">${ICO[t]}<span>${t}</span>${t==='Presupuestos'&&np?`<div class="tabBadge">${np}</div>`:''}</button>`).join('')}</div>`;
 const live=$('#live');if(tab==='Presupuestos')quotesView(live);if(tab==='Calendario')calendarView(live);if(tab==='Clientes')clientsView(live);if(tab==='Portfolio')portfolioView(live);if(tab==='Finanzas')financeView(live);if(tab==='Ajustes')settingsView(live)
}
function quotesView(el){
 const pending=D.quotes.filter(q=>q.status==='pending_quote'),waiting=D.quotes.filter(q=>q.status==='awaiting_confirmation'),disc=D.quotes.filter(q=>q.status==='discarded').slice(0,20);
 const today=D.today;
 const todayAppts=D.appointments.filter(a=>a.date===today&&['scheduled','another_session'].includes(a.status)).sort((a,b)=>a.start_time.localeCompare(b.start_time));
 const now=new Intl.DateTimeFormat('es-AR',{timeZone:'America/Argentina/Buenos_Aires',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date());
 const next=todayAppts.find(a=>a.start_time.slice(0,5)>=now)||null;
 const todayLabel=new Date(today+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());
 const todayCard=`<div class="sectionCaption" style="margin-top:14px">Hoy · ${todayLabel}</div><div class="group todaySummary"><div class="todaySummaryMain"><div><div class="todayEyebrow">${todayAppts.length?todayAppts.length+(todayAppts.length===1?' turno':' turnos'):'Agenda libre'}</div>${next?`<div class="todayNext">${next.start_time.slice(0,5)} · ${esc(next.name)}</div><div class="todayMeta">${dur(next.duration_minutes)} · ${money(next.price)}</div>`:`<div class="todayNext">${todayAppts.length?'No quedan turnos hoy':'No hay turnos hoy'}</div><div class="todayMeta">${pending.length?`Tenés ${pending.length} ${pending.length===1?'presupuesto pendiente':'presupuestos pendientes'}.`:'Todo al día.'}</div>`}</div>${todayAppts.length?`<button class="todayGo" onclick="selDay='${today}';showTab('Calendario')">Ver agenda</button>`:''}</div>${pending.length||waiting.length?`<div class="todayAlerts">${pending.length?`<span>${pending.length} por cotizar</span>`:''}${waiting.length?`<span>${waiting.length} por agendar</span>`:''}</div>`:''}</div>`;
 el.innerHTML=todayCard+`<div class="statsGrid" style="grid-template-columns:1fr 1fr;margin-top:4px;"><div class="statCard"><div class="statNum">${pending.length}</div><div class="statLbl">Por cotizar</div></div><div class="statCard"><div class="statNum">${waiting.length}</div><div class="statLbl">Por agendar</div></div></div>${quoteGroup('Pendientes de cotizar',pending,true)}${waiting.length?quoteGroup('Esperando confirmación del cliente',waiting,false):''}${disc.length?`<div class="sectionCaption">Descartados</div><div class="group">${disc.map(q=>`<div class="reqCard"><div class="reqTop"><div><div class="reqName">${esc(q.name)}</div><div class="reqMeta">${esc(q.whatsapp)}</div></div><div class="reqTime">Descartado</div></div><div class="reqDesc">${esc(q.description)}</div></div>`).join('')}</div>`:''}`
}
function quoteGroup(title,list,canQuote){return `<div class="sectionCaption">${title}</div><div class="group">${list.map(q=>`<div class="reqCard"><div class="reqTop"><div><div class="reqName">${esc(q.name)}</div><div class="reqMeta">${esc(q.whatsapp)}</div></div><div class="reqTime">${new Date(q.created_at).toLocaleDateString('es-AR')}</div></div><div class="reqDesc">${esc(q.description)}</div><div class="reqTags"><span class="tag">📍 ${esc(q.body_area||'—')}</span><span class="tag">📏 ${esc(q.size||'—')}</span>${q.has_reference?`<span class="tag" style="cursor:pointer;text-decoration:underline" onclick="viewReference('${q.id}')">📎 Ver referencia</span>`:''}${!canQuote&&q.price?`<span class="tag">💲 ${money(q.price)}</span>`:''}</div><div class="reqActions">${canQuote?`<button class="miniBtn primary" onclick="quote('${q.id}')">Cotizar</button><button class="miniBtn ghost" onclick="discard('${q.id}')">Descartar</button>`:`<button class="miniBtn primary" onclick="scheduleQuote('${q.id}')">Agendar</button><button class="miniBtn ghost" onclick="cancelQuote('${q.id}')">Cancelar</button>`}</div></div>`).join('')||'<div class="empty" style="padding:18px 16px;color:var(--label3)">No hay solicitudes.</div>'}</div>`}
function viewReference(id){window.open('/api/reference?quote_id='+encodeURIComponent(id),'_blank','noopener')}
async function discard(id){if(!confirm('¿Descartar presupuesto?'))return;await api('/admin/quote/discard',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});await load()}
async function cancelQuote(id){await discard(id)}
function clientsView(el){
 const q=(window.clientQuery||'').trim().toLowerCase();
 const list=(D.clients||[]).filter(c=>!q||String(c.name||'').toLowerCase().includes(q)||String(c.whatsapp||'').toLowerCase().includes(q));
 el.innerHTML=`<div class="sectionCaption" style="margin-top:14px">Clientes · ${D.clients.length}</div><div class="clientSearch"><input id="clientSearchInput" value="${esc(window.clientQuery||'')}" placeholder="Buscar por nombre o WhatsApp" autocomplete="off"></div><div class="group" style="margin-top:8px">${list.map(c=>`<div class="clientRow" onclick="openClient('${c.id}')"><div><div class="clientName">${esc(c.name)}</div><div class="clientWa">${esc(c.whatsapp)}</div></div><div class="clientArrow">›</div></div>`).join('')||'<div class="empty" style="padding:20px 16px;color:var(--label3)">No encontramos clientes.</div>'}</div>`;
 const input=document.getElementById('clientSearchInput'); if(input){input.addEventListener('input',e=>{window.clientQuery=e.target.value;clientsView(document.getElementById('live'));const n=document.getElementById('clientSearchInput');n?.focus();n?.setSelectionRange(n.value.length,n.value.length)})}
}
async function openClient(id){
 try{const d=await api('/admin/client?id='+encodeURIComponent(id)); clientSheet(d)}catch(e){alert(e.message)}
}
function clientSheet(d){
 const c=d.client||{}, ap=(d.appointments||[]), qs=(d.quotes||[]), fu=(d.followups||[]), hist=(d.history||[]);
 const upcoming=ap.filter(a=>['scheduled','another_session'].includes(a.status)).sort((a,b)=>(a.date+a.start_time).localeCompare(b.date+b.start_time));
 const lastDone=ap.filter(a=>a.status==='completed').sort((a,b)=>(b.date+b.start_time).localeCompare(a.date+a.start_time))[0];
 const events=[...ap.map(a=>({date:a.date,time:a.start_time,title:a.status==='completed'?'Sesión realizada':a.status==='cancelled'?'Turno cancelado':a.status==='another_session'?'Sesión con otra sesión pendiente':'Turno agendado',meta:`${dur(a.duration_minutes)} · ${money(a.price)}`})),...qs.map(q=>({date:(q.created_at||'').slice(0,10),time:'',title:'Presupuesto',meta:`${q.status==='awaiting_confirmation'?'Enviado':q.status==='pending_quote'?'Pendiente':q.status==='scheduled'?'Agendado':'Descartado'}${q.price?` · ${money(q.price)}`:''}`})),...fu.map(f=>({date:(f.created_at||'').slice(0,10),time:'',title:'Seguimiento',meta:f.note||'Seguimiento registrado'}))].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 const g=document.getElementById('genSheet');
 g.innerHTML=`<div class="grabber"></div><button class="sheetClose" onclick="closeSheet()">✕</button><div class="clientDetailHead"><div class="clientDetailName">${esc(c.name)}</div><div class="clientDetailWa">${esc(c.whatsapp)}</div></div><div class="clientMetrics"><div class="clientMetric"><b>${d.tattoos_count||0}</b><span>Sesiones</span></div><div class="clientMetric"><b>${money(d.total_spent||0)}</b><span>Total</span></div><div class="clientMetric"><b>${upcoming.length}</b><span>Próximos</span></div></div><div class="clientQuickActions"><a class="miniBtn primary" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(c.whatsapp)}">WhatsApp</a><button class="miniBtn ghost" onclick="addClientFollowup('${esc(c.id)}')">Nuevo seguimiento</button>${lastDone?`<button class="miniBtn ghost" onclick="scheduleNextSession('${esc(c.id)}','${lastDone.id}')">Agendar otra sesión</button>`:''}</div><div class="sectionCaption">Nota del cliente</div><div class="group"><div class="clientNoteBox"><div class="clientNoteText">${c.notes?esc(c.notes):'<span class="clientNoteEmpty">Guardá acá información útil para futuras sesiones. Solo la ve Feli.</span>'}</div><button class="miniBtn ghost" style="margin-top:10px;width:100%" onclick="editClientNotes('${esc(c.id)}',${JSON.stringify(c.notes||'')})">${c.notes?'Editar nota':'Agregar nota'}</button></div></div>${upcoming.length?`<div class="sectionCaption">Próximo turno</div><div class="group"><div class="clientEvent" style="padding:14px 16px"><div class="clientEventTop"><span>${fmtDay(upcoming[0].date)} · ${upcoming[0].start_time.slice(0,5)}</span><span>${money(upcoming[0].price)}</span></div><div class="clientEventMeta">${dur(upcoming[0].duration_minutes)} · ${ST[upcoming[0].status]||upcoming[0].status}</div></div></div>`:''}<div class="sectionCaption">Historial</div><div class="group clientTimeline">${events.slice(0,20).map(e=>`<div class="clientEvent"><div class="clientEventTop"><span>${esc(e.title)}</span><span>${esc(e.date||'')}</span></div><div class="clientEventMeta">${esc((e.time?e.time.slice(0,5)+' · ':'')+e.meta)}</div></div>`).join('')||'<div style="padding:16px 0;color:var(--label3)">Todavía no hay actividad.</div>'}</div>${lastDone?`<div class="footnote">Última sesión: ${fmtDay(lastDone.date)}.</div>`:''}`;
 document.getElementById('genOverlay').classList.add('show');
}
function editClientNotes(id,current){sheet('Nota del cliente',[{id:'notes',label:'Nota privada',area:1,value:current||'',placeholder:'Ej: Prefiere horarios de tarde. Tiene una idea para la próxima sesión.',hint:'Solo la ve Feli en Gestión.'}],'Guardar',async v=>{if(v.notes.length>1000)throw new Error('La nota no puede superar 1000 caracteres.');await post('/admin/client/notes',{id,notes:v.notes});const d=await api('/admin/client?id='+encodeURIComponent(id));clientSheet(d)})}
function addClientFollowup(id){sheet('Nuevo seguimiento',[{id:'note',label:'Qué pasó',area:1,placeholder:'Ej: Le escribí por WhatsApp para consultar cómo cicatrizó el tatuaje.'}],'Guardar',async v=>{if(!v.note.trim())throw new Error('Escribí una nota.');await post('/admin/followup',{client_id:id,note:v.note});const d=await api('/admin/client?id='+encodeURIComponent(id));clientSheet(d)})}

function portfolioView(el){
 const list=D.portfolio||[];
 el.innerHTML=`<div class="sectionCaption" style="margin-top:14px">Trabajos publicados</div><div class="group">${list.map(x=>`<div class="portfolioAdminCard"><img class="portfolioAdminThumb" src="${esc(x.image_url)}" alt="" loading="lazy"><div class="portfolioAdminBody"><div class="portfolioAdminName">${esc(x.description||'Trabajo sin descripción')}</div><div class="portfolioAdminDesc">${esc(x.description||'Agregá una descripción breve para mostrar debajo de la foto.')}</div><button class="portfolioAdminEdit" onclick="editPortfolio('${esc(x.id)}')">Editar descripción</button></div></div>`).join('')||'<div class="empty" style="padding:18px 16px;color:var(--label3)">No hay trabajos cargados.</div>'}</div><div class="footnote" style="margin-bottom:20px">Las fotos forman parte del proyecto y no se reemplazan desde Gestión. Acá solo podés editar el texto asociado a cada trabajo.</div>`;
}
function editPortfolio(id){const x=(D.portfolio||[]).find(p=>p.id===id);if(!x)return;sheet('Editar descripción',[{id:'description',label:'Descripción',area:1,value:x.description||'',placeholder:'Ej: Microrealismo de tigre en antebrazo',hint:'Se muestra cuando se abre la foto en la web pública.'}],'Guardar',async v=>{if(v.description.length>500)throw new Error('La descripción no puede superar 500 caracteres.');await post('/admin/portfolio',{id,description:v.description})})}

function calendarView(el){
 const y=calDate.getFullYear(),m=calDate.getMonth(),days=new Date(y,m+1,0).getDate(),lead=(new Date(y,m,1).getDay()+6)%7,sd=selDay||D.today;
 const cells=Array(lead).fill('<div class="day other"></div>');
 for(let d=1;d<=days;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`,n=D.appointments.filter(x=>x.date===k&&['scheduled','another_session'].includes(x.status)).length,sch=D.settings.schedule&&D.settings.schedule[new Date(y,m,d).getDay()],closed=Array.isArray(sch)&&sch.length===0,full=(D.day_blocks||[]).some(x=>(x.date||x)===k);
  cells.push(`<button class="day ${closed?'closed':''} ${full?'full':''} ${k===D.today?'today':''} ${k===sd?'selected':''}" onclick="day('${k}')"><span>${d}</span>${full?'<span class="fullLbl">Llena</span>':n?`<span class="dayCount">${n}</span>`:''}</button>`)}
 const list=D.appointments.filter(a=>a.date===sd).sort((a,b)=>a.start_time.localeCompare(b.start_time)),blocked=(D.day_blocks||[]).some(x=>(x.date||x)===sd),active=list.filter(a=>['scheduled','another_session'].includes(a.status)),expected=active.reduce((sum,a)=>sum+Number(a.price||0),0);
 const dayLabel=fmtDay(sd), dayMeta=active.length?`${active.length} ${active.length===1?'turno':'turnos'} · ${money(expected)} previstos`:'Sin turnos previstos';
 el.innerHTML=`<div class="group" style="margin-top:14px;"><div class="calHead"><button class="calArrow" aria-label="Mes anterior" onclick="cal(-1)">‹</button><div class="calHeadCenter"><div class="calMonth">${new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(calDate).replace(/^./,c=>c.toUpperCase())}</div><div class="calSelectedMeta">${sd===D.today?'Hoy seleccionado':'Día seleccionado'}</div></div><button class="calToday" onclick="goToday()">Hoy</button><button class="calArrow" aria-label="Mes siguiente" onclick="cal(1)">›</button></div><div class="weekRow"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div><div class="calGrid">${cells.join('')}</div><div class="dayAgenda"><div class="dayAgendaHead"><div><div class="dayAgendaTitle">${dayLabel}</div><div class="dayAgendaMeta">${dayMeta}</div></div><div class="dayAgendaCount">${blocked?'Agenda llena':active.length?'Agenda activa':'Libre'}</div></div>${list.map(appointmentRow).join('')||'<div style="padding:10px 0 14px;color:var(--label3);font-size:14px">No hay turnos para este día.</div>'}<div class="reqActions"><button class="miniBtn primary" onclick="newTurn('${sd}')">+ Nuevo turno</button>${blocked?`<button class="miniBtn ghost" onclick="unblock('${sd}')">Quitar agenda llena</button>`:`<button class="miniBtn ghost" onclick="block('${sd}')">Agenda llena</button>`}</div></div></div>`}
function cal(d){calDate.setMonth(calDate.getMonth()+d);render()}
function goToday(){calDate=new Date();calDate.setDate(1);selDay=D.today;render()}
function day(k){selDay=k;render()}
function appointmentRow(a){return `<div class="apptCard"><div class="apptMain"><div><div class="apptTime">${a.start_time.slice(0,5)}</div><div class="apptName">${esc(a.name)}</div><div class="apptMeta">${dur(a.duration_minutes)} · ${money(a.price)}</div></div><div class="apptStatus">${ST[a.status]||a.status}</div></div>${a.status==='scheduled'?`<div class="apptActions"><button class="miniBtn primary" onclick="complete('${a.id}')">Hecho</button><button class="miniBtn ghost" onclick="editTurn('${a.id}')">Editar</button></div><button class="miniBtn ghost" style="width:100%;margin-top:7px" onclick="cancelTurn('${a.id}')">Cancelar turno</button>`:a.status==='completed'?`<div class="apptActions"><button class="miniBtn ghost" onclick="scheduleNextSession('${a.client_id}','${a.id}')">Agendar otra sesión</button></div>`:''}</div>`}
async function cancelTurn(id){if(!confirm('¿Cancelar turno?'))return;try{await api('/admin/appointment/cancel',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id})});await load()}catch(e){alert(e.message)}}
async function block(date){await api('/admin/day-block',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({date})});await load()}
async function unblock(date){await api('/admin/day-block',{method:'DELETE',headers:{'content-type':'application/json'},body:JSON.stringify({date})});await load()}
async function financeView(el){const f=await api('/admin/finance?month='+month),S=f.summary,mes=new Intl.DateTimeFormat('es-AR',{month:'long',year:'numeric'}).format(new Date(month+'-15T12:00:00'));
 const totalTurnos=Number(S.tattoos_completed||0)+Number(S.cancelled||0)+Number(S.scheduled||0);
 const cancelRate=totalTurnos?Math.round((Number(S.cancelled||0)/totalTurnos)*100):0;
 el.innerHTML=`<div class="finTotal"><div class="finMonthNav"><button class="calArrow" aria-label="Mes anterior" onclick="finMonth(-1)">‹</button><div><div class="finLabel">${mes}</div><div class="finMonthHint">Resumen del período</div></div><button class="calArrow" aria-label="Mes siguiente" onclick="finMonth(1)">›</button></div><div class="finHero"><div><div class="finHeroLabel">Ingresos cobrados</div><div class="finAmount">${money(S.total_income)}</div></div><div class="finHeroSide"><span>${S.tattoos_completed||0} sesiones</span><span>Ticket ${money(S.average_ticket)}</span></div></div></div><div class="statsGrid"><div class="statCard"><div class="statNum">${S.scheduled||0}</div><div class="statLbl">Pendientes</div></div><div class="statCard"><div class="statNum">${money(S.scheduled_income)}</div><div class="statLbl">Por cobrar</div></div><div class="statCard"><div class="statNum">${S.cancelled||0}</div><div class="statLbl">Cancelados</div></div><div class="statCard"><div class="statNum">${cancelRate}%</div><div class="statLbl">Cancelación</div></div></div><div class="financeBreakdown"><div class="financeBreakTitle">Cobrado por medio</div><div class="financeBreakRows"><div><span>Efectivo</span><strong>${money(S.cash_income)}</strong></div><div><span>Transferencia</span><strong>${money(S.transfer_income)}</strong></div></div></div><div style="padding:12px 16px 4px;"><div class="segmented"><div class="seg ${finTab==='ingresos'?'active':''}" onclick="setFin('ingresos')">Ingresos</div><div class="seg ${finTab==='stock'?'active':''}" onclick="setFin('stock')">Stock</div></div></div>`+
 (finTab==='ingresos'?`<div class="sectionCaption">Movimiento del mes</div><div class="group">${f.daily.map(d=>`<div class="ledgerRow"><div><div class="ledgerDate">${fmtDay(d.date)}</div><div class="ledgerSub">${d.completed} ${d.completed===1?'sesión':'sesiones'}${d.cancelled?' · '+d.cancelled+' cancelado'+(d.cancelled>1?'s':''):''}</div></div><div class="ledgerAmount">${money(d.income)}</div></div>`).join('')||'<div style="padding:16px;color:var(--label3)">Sin movimientos este mes.</div>'}</div>`
 :`<div class="sectionCaption">Insumos</div><div class="group">${D.stock.map(s=>{const low=Number(s.quantity)<=Number(s.minimum_quantity);return `<div class="stockRow"><div class="stockInfo"><div class="stockName" onclick="stockEdit('${s.id}')">${esc(s.name)}</div><div class="stockQty">${s.quantity} ${esc(s.unit)}</div></div><div class="stockBadge ${low?'low':'ok'}">${low?'REPONER':'OK'}</div><div class="stockCtrls"><button onclick="stockSub('${s.id}')">–</button><button onclick="stockAdd('${s.id}')">+</button><button onclick="stockDel('${s.id}')">×</button></div></div>`}).join('')||'<div style="padding:16px;color:var(--label3)">No hay insumos cargados.</div>'}</div><div style="padding:14px 16px 0;"><button class="btn btnFilled" onclick="stockNew()">+ Agregar insumo</button></div>`)}
function finMonth(delta){const d=new Date(month+'-15T12:00:00');d.setMonth(d.getMonth()+delta);month=d.toISOString().slice(0,7);render()}
function setFin(v){finTab=v;render()}
const FIELDS={studio_name:{l:'Nombre del estudio'},artist_name:{l:'Nombre del artista'},description:{l:'Descripción',area:1,h:'Se muestra en la página pública.'},address:{l:'Dirección'},maps_url:{l:'Enlace de Google Maps',h:'Pegá acá el link de Google Maps del estudio.'},instagram:{l:'Instagram',h:'Ejemplo: @solo.tinta.ink'},safety_info:{l:'Garantías de seguridad e higiene',area:1,h:'Aparece en el pop-up de información de la página pública.'},contact_info:{l:'Contacto',area:1,h:'Aparece en el pop-up de información de la página pública.'}};
function editField(k){const f=FIELDS[k];sheet(f.l,[{id:'v',label:f.l,area:f.area,value:D.settings[k]||'',hint:f.h}],'Guardar',async v=>{if((k==='studio_name'||k==='artist_name')&&!v.v)throw new Error('No puede quedar vacío.');await post('/admin/settings',{[k]:v.v})})}
function settingsView(el){const item=k=>{const f=FIELDS[k],val=D.settings[k];return `<div class="settingRow" onclick="editField('${k}')"><div class="settingText" style="min-width:0;flex:1"><div style="font-size:12.5px;color:var(--label3);margin-bottom:2px">${f.l}</div><div style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word;${val?'':'color:var(--label3)'}">${esc(val||'Tocá para completar')}</div></div>${CHEV}</div>`};const row=(i,t,fn,cls='')=>`<div class="settingRow ${cls}" onclick="${fn}">${SICO[i]}<div class="settingText">${t}</div>${cls?'':CHEV}</div>`;
 el.innerHTML=`<div class="sectionCaption">Estudio · tocá lo que quieras cambiar</div><div class="group">${['studio_name','artist_name','description','address','maps_url','instagram'].map(item).join('')}</div><div class="sectionCaption">Información del estudio (página pública)</div><div class="group">${['safety_info','contact_info'].map(item).join('')}</div><div class="sectionCaption">Seguridad</div><div class="group">${row(3,'Cambiar PIN','changePin()')}</div><div class="sectionCaption">&nbsp;</div><div class="group">${row(4,'Cerrar sesión','logout()','danger')}</div><div style="text-align:center;color:var(--label3);font-size:12px;padding:18px 0 4px">Gestión · versión ${BUILD}</div>`}
/* ---------- Hojas (pop-ups del diseño) ---------- */
const SELSTYLE='';
function closeSheet(){document.getElementById('genOverlay').classList.remove('show')}
function sheet(title,fields,label,onSubmit,opts={}){
 const g=document.getElementById('genSheet');
 g.innerHTML=`<div class="grabber"></div><button class="sheetClose" onclick="closeSheet()">✕</button><div class="sheetTitle">${esc(title)}</div>${opts.intro?`<div class="rowStack"><div class="rowLabel" style="margin:0">${esc(opts.intro)}</div></div>`:''}${fields.map(f=>`<div class="rowStack"><div class="rowLabel" style="margin-bottom:8px">${esc(f.label)}</div>${f.options?`<select id="sf_${f.id}" style="${SELSTYLE}">${f.options.map(o=>`<option value="${esc(o.v)}" ${String(o.v)===String(f.value)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>`:f.area?`<textarea id="sf_${f.id}" rows="3" placeholder="${esc(f.placeholder||'')}" style="${SELSTYLE}resize:none;">${esc(f.value??'')}</textarea>`:`<input id="sf_${f.id}" type="${f.type||'text'}" ${f.inputmode?`inputmode="${f.inputmode}"`:''} ${f.min?`min="${f.min}"`:''} ${f.max?`maxlength="${f.max}"`:''} value="${esc(f.value??'')}" placeholder="${esc(f.placeholder||'')}">`}${f.hint?`<div class="sheetHint">${esc(f.hint)}</div>`:''}</div>`).join('')}<div class="sheetActions"><div id="sheetErr" style="color:#ff6b81;font-size:14px;margin-bottom:8px"></div><button class="btn btnFilled" id="sheetOk">${esc(label)}</button></div>`;
 document.getElementById('genOverlay').classList.add('show');
 g.querySelectorAll('textarea').forEach(t=>{const fit=()=>{t.style.height='auto';t.style.height=Math.max(96,t.scrollHeight+2)+'px'};t.addEventListener('input',fit);fit();setTimeout(fit,60)});
 document.getElementById('sheetOk').onclick=async()=>{const v={};fields.forEach(f=>v[f.id]=document.getElementById('sf_'+f.id).value.trim());const b=document.getElementById('sheetOk');b.disabled=true;document.getElementById('sheetErr').textContent='';try{const r=await onSubmit(v);if(r&&r.keep){await load();return}closeSheet();await load()}catch(e){document.getElementById('sheetErr').textContent=e.message;b.disabled=false}}
}
const post=(path,body,method='POST')=>api(path,{method,headers:{'content-type':'application/json'},body:JSON.stringify(body)});
const digits=v=>Number(String(v||'').replace(/\D/g,''));
const num=v=>Number(String(v||'').replace(',','.'));
function parseDur(v){v=String(v||'').trim().replace(',','.');let m=/^(\d{1,2}):([0-5]\d)$/.exec(v),min=NaN;if(m)min=+m[1]*60+ +m[2];else if(/^\d+(\.\d+)?$/.test(v))min=Math.round(parseFloat(v)*60);if(!(min>0)||min>16*60)throw new Error('Duración inválida. Usá horas, por ejemplo 2 o 2:30.');return min}
const durTxt=v=>`${Math.floor(v/60)}:${String(v%60).padStart(2,'0')}`;

/* Presupuestos */
function quote(id){sheet('Cotizar',[{id:'price',label:'Precio ($)',inputmode:'numeric',placeholder:'0'},{id:'dur',label:'Duración estimada (horas)',placeholder:'Ej: 2 o 2:30'}],'Confirmar y enviar cotización',async v=>{const price=digits(v.price);if(!(price>0))throw new Error('Poné un precio.');const r=await post('/admin/quote/price',{id,price,duration:parseDur(v.dur)});const g=document.getElementById('genSheet');g.innerHTML=`<div class="grabber"></div><button class="sheetClose" onclick="closeSheet()">✕</button><div class="sheetTitle">Cotización guardada</div><div class="rowStack"><div class="rowLabel" style="margin:0;white-space:pre-line">${esc(r.message||'')}</div></div><div class="sheetActions"><a class="btn btnFilled" style="display:block;text-align:center;text-decoration:none;box-sizing:border-box" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(r.whatsapp)}?text=${encodeURIComponent(r.message||'')}">Enviar por WhatsApp</a></div>`;return{keep:true}})}
function scheduleQuote(id){const q=D.quotes.find(x=>x.id===id);sheet('Agendar turno',[{id:'date',label:'Fecha',type:'date',min:D.today},{id:'time',label:'Hora de inicio',type:'time'}],'Agendar',async v=>{if(!v.date||!v.time)throw new Error('Elegí fecha y hora.');await post('/admin/appointment',{quote_id:id,client_id:q.client_id,date:v.date,start_time:v.time,duration_minutes:q.duration_minutes,price:q.price});selDay=v.date;const d=new Date(v.date+'T12:00:00');calDate=new Date(d.getFullYear(),d.getMonth(),1);tab='Calendario'},{intro:`${q.name} · ${durTxt(q.duration_minutes)} h · ${money(q.price)}`})}

/* Turnos */
function newTurn(date){if(!D.clients.length)return alert('Todavía no hay clientes. Cargá primero un presupuesto.');sheet('Nuevo turno',[{id:'client',label:'Cliente',options:D.clients.map(c=>({v:c.id,t:`${c.name} · ${c.whatsapp}`}))},{id:'date',label:'Fecha',type:'date',value:date},{id:'time',label:'Hora de inicio',type:'time'},{id:'dur',label:'Duración (horas)',placeholder:'Ej: 2 o 2:30'},{id:'price',label:'Precio ($)',inputmode:'numeric'}],'Crear turno',async v=>{if(!v.date||!v.time)throw new Error('Elegí fecha y hora.');await post('/admin/appointment',{client_id:v.client,date:v.date,start_time:v.time,duration_minutes:parseDur(v.dur),price:digits(v.price)});selDay=v.date})}
function scheduleNextSession(clientId,appointmentId){const a=D.appointments.find(x=>x.id===appointmentId);const client=D.clients.find(x=>x.id===clientId);if(!client)return;const fallbackDate=D.today;sheet('Agendar otra sesión',[{id:'date',label:'Fecha',type:'date',min:D.today,value:fallbackDate},{id:'time',label:'Hora de inicio',type:'time'},{id:'dur',label:'Duración (horas)',value:a?durTxt(a.duration_minutes):'',placeholder:'Ej: 2 o 2:30'},{id:'price',label:'Precio ($)',inputmode:'numeric',value:a?String(a.price):''}],'Agendar',async v=>{if(!v.date||!v.time)throw new Error('Elegí fecha y hora.');await post('/admin/appointment',{client_id:clientId,date:v.date,start_time:v.time,duration_minutes:parseDur(v.dur),price:digits(v.price)});selDay=v.date;const d=new Date(v.date+'T12:00:00');calDate=new Date(d.getFullYear(),d.getMonth(),1);tab='Calendario'},{intro:`${client.name} · continuación de la sesión anterior`})}
function editTurn(id){const a=D.appointments.find(x=>x.id===id);sheet('Editar turno',[{id:'date',label:'Fecha',type:'date',value:a.date},{id:'time',label:'Hora de inicio',type:'time',value:a.start_time.slice(0,5)},{id:'dur',label:'Duración (horas)',value:durTxt(a.duration_minutes)}],'Guardar cambios',async v=>{if(!v.date||!v.time)throw new Error('Elegí fecha y hora.');await post('/admin/appointment/edit',{id,date:v.date,start_time:v.time,duration_minutes:parseDur(v.dur)});selDay=v.date},{intro:a.name})}
function another(id){const a=D.appointments.find(x=>x.id===id);sheet('Otra sesión',[{id:'note',label:'Nota (opcional)',placeholder:'Ej: falta sombreado'}],'Guardar',async v=>{await post('/admin/appointment/another-session',{id,note:v.note})},{intro:a.name+' · queda pendiente otra sesión'})}
function complete(id){const a=D.appointments.find(x=>x.id===id);sheet('Turno realizado',[{id:'pay',label:'Forma de pago',options:[{v:'cash',t:'Efectivo'},{v:'transfer',t:'Transferencia'}]},...D.stock.map(s=>({id:'use_'+s.id,label:`${s.name} usado (${s.unit}) · hay ${s.quantity}`,inputmode:'decimal',placeholder:'0'}))],'Marcar como hecho',async v=>{const items=D.stock.map(s=>({id:s.id,quantity:num(v['use_'+s.id]||0),name:s.name,have:Number(s.quantity)})).filter(x=>x.quantity>0);for(const x of items){if(!Number.isFinite(x.quantity))throw new Error('Cantidad inválida en '+x.name+'.');if(x.quantity>x.have)throw new Error('No alcanza el stock de '+x.name+' (hay '+x.have+').')}await post('/admin/appointment/complete',{id,payment_method:v.pay});if(items.length)await post('/admin/stock/use',{appointment_id:id,items:items.map(x=>({id:x.id,quantity:x.quantity}))})},{intro:`${a.name} · ${money(a.price)}`})}

/* Stock */
function stockNew(){sheet('Agregar insumo',[{id:'name',label:'Nombre',placeholder:'Ej: Agujas 5RL'},{id:'qty',label:'Cantidad inicial',inputmode:'decimal',placeholder:'0'},{id:'unit',label:'Unidad',value:'unidad'},{id:'min',label:'Avisar cuando quede menos de',inputmode:'decimal',value:'0'}],'Agregar',async v=>{if(!v.name)throw new Error('Poné un nombre.');const q=num(v.qty||0),m=num(v.min||0);if(!Number.isFinite(q)||q<0||!Number.isFinite(m)||m<0)throw new Error('Cantidad inválida.');await post('/admin/stock',{name:v.name,quantity:q,unit:v.unit||'unidad',minimum_quantity:m})})}
function stockAdd(id){const s=D.stock.find(x=>x.id===id);sheet('Sumar stock',[{id:'qty',label:`Cantidad a sumar (${s.unit})`,inputmode:'decimal',placeholder:'0'}],'Sumar',async v=>{const q=num(v.qty);if(!(q>0))throw new Error('Cantidad inválida.');await post('/admin/stock/restock',{id,quantity:q})},{intro:`${s.name} · hay ${s.quantity} ${s.unit}`})}
function stockSub(id){const s=D.stock.find(x=>x.id===id);sheet('Restar stock',[{id:'qty',label:`Cantidad a restar (${s.unit})`,inputmode:'decimal',placeholder:'0'}],'Restar',async v=>{const q=num(v.qty);if(!(q>0))throw new Error('Cantidad inválida.');if(q>Number(s.quantity))throw new Error('No podés restar más de lo que hay ('+s.quantity+').');await post('/admin/stock/adjust',{id,delta:-q})},{intro:`${s.name} · hay ${s.quantity} ${s.unit}`})}
function stockEdit(id){const s=D.stock.find(x=>x.id===id);sheet('Editar insumo',[{id:'name',label:'Nombre',value:s.name},{id:'unit',label:'Unidad',value:s.unit},{id:'min',label:'Avisar cuando quede menos de',inputmode:'decimal',value:s.minimum_quantity}],'Guardar',async v=>{if(!v.name)throw new Error('Poné un nombre.');const m=num(v.min||0);if(!Number.isFinite(m)||m<0)throw new Error('Valor inválido.');await post('/admin/stock',{id,name:v.name,quantity:Number(s.quantity),unit:v.unit||'unidad',minimum_quantity:m})})}
async function stockDel(id){const s=D.stock.find(x=>x.id===id);if(!confirm('¿Borrar "'+s.name+'" del stock?'))return;try{await post('/admin/stock',{id},'DELETE');await load()}catch(e){alert(e.message)}}

/* Ajustes */
function changePin(){sheet('Cambiar PIN',[{id:'pin',label:'Nuevo PIN de 4 dígitos',inputmode:'numeric',max:4,placeholder:'••••'}],'Cambiar PIN',async v=>{if(!/^\d{4}$/.test(v.pin))throw new Error('El PIN debe tener 4 dígitos.');await post('/admin/settings/pin',{pin:v.pin});await post('/logout',{});location.reload();return{keep:true}})}
async function logout(){await api('/logout',{method:'POST'});location.reload()}
(async()=>{try{const h=await fetch('/api/health',{cache:'no-store'}).then(r=>r.json());if(h.build&&h.build!==BUILD&&!/[?&]b=/.test(location.search)){location.replace(location.pathname+'?b='+Date.now());return}}catch{}})();
(async()=>{try{await load();document.getElementById('loginScreen').style.display='none'}catch(e){renderDots()}})();
</script>
</body>
</html>
